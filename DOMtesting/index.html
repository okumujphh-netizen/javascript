<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub DOM Testing</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <header>
        <h1 id="heading">EventHub</h1>
        <p>Discover events and connect with people.</p>
    </header>

    <main>
        <button id="welcome-button">Show Welcome Message</button>
        <p id="message" aria-live="polite"></p>

        <label for="search">Search events</label>
        <input id="search" type="text" placeholder="Try Tech or Music">

        <section id="event-list">
            <article class="event-card">
                <h2>Tech Conference</h2>
                <button class="register-button">Register Interest</button>
            </article>

            <article class="event-card">
                <h2>Music Festival</h2>
                <button class="register-button">Register Interest</button>
            </article>

            <article class="event-card">
                <h2>Design Workshop</h2>
                <button class="register-button">Register Interest</button>
            </article>
        </section>
    </main>
</body>

</html>
